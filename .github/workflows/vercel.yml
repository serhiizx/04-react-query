name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Одночасно виконується лише один деплой на гілку; проміжні запуски скасовуються
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Проєкт використовує pnpm-lock.yaml — `vercel build` викликає pnpm, якого немає на раннері
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # main → production, решта → preview
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "env=preview" >> "$GITHUB_OUTPUT"
          fi

      # Підтягує налаштування проєкту та змінні оточення (VITE_TMDB_TOKEN) з Vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}
